{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="glass-card p-5">
            <h2 class="fw-bold mb-4 text-center">Welcome Back</h2>
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label">Email Address</label>
                    <input type="email" name="email" class="form-control" required placeholder="name@example.com">
                </div>
                <div class="mb-4">
                    <label class="form-label">Password</label>
                    <input type="password" name="password" class="form-control" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn btn-primary w-100 py-3 mb-3">Sign In</button>
            </form>
            <p class="text-center text-muted">Don't have an account? <a href="{{ url_for('register') }}">Register</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
